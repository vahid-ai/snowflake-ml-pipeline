version: 2

sources:
  - name: raw_lamda
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: raw_lamda
    tables:
      - name: lamda_samples
        description: >
          Raw IQSeC-Lab/LAMDA rows streamed from Hugging Face into Snowflake by dlt.
        columns:
          - name: dataset_id
            tests:
              - not_null
          - name: config_name
            tests:
              - not_null
          - name: split_name
            tests:
              - not_null
          - name: row_number
            tests:
              - not_null
          - name: hash
            tests:
              - not_null
          - name: label
            tests:
              - not_null
