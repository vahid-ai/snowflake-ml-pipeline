[project]
name = "snowflake-ml-pipeline"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.0",
    "dbt-snowflake>=1.10.1",
    "dlt[filesystem,parquet,pyiceberg,s3,snowflake]>=1.28.0",
    "huggingface-hub>=0.35.0",
    "kaggle>=2.2.2",
    "kagglehub>=1.0.2",
    "psutil>=7.2.2",
    "pyarrow>=17.0.0",
    "pyinstrument>=5.1.2",
]

[project.optional-dependencies]
# Only scripts/duckdb_ui.py needs DuckDB: it attaches R2 Data Catalog as an
# Iceberg REST catalog and opens the DuckDB UI to browse the tables. Kept out
# of the main dependencies so the ingestion pipeline does not carry it.
#   uv sync --extra duckdb
duckdb = ["duckdb>=1.2.2"]
# Sparse malware training and inference; ingestion does not need these.
# The bounded reader uses Iceberg schema/delete helpers covered against this version.
ml = ["scikit-learn>=1.6,<1.9", "scipy>=1.13", "numpy>=1.26", "joblib>=1.4", "pyyaml>=6.0", "mlflow>=3.1,<4", "pyiceberg==0.11.1"]
# Add --extra lightning for the feedforward and autoencoder model adapters.
lightning = ["torch>=2.5,<3", "lightning>=2.5,<3"]
