name: Repository plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin test dependencies
        run: python -m pip install -r plugins/ml-feature-governance/requirements.txt -r plugins/agent-code-intelligence/requirements-dev.txt
      - name: Test ML feature governance
        run: python -m unittest discover -s plugins/ml-feature-governance/tests -v
      - name: Test Agent Code Intelligence
        run: python -m unittest discover -s plugins/agent-code-intelligence/tests -v
      - name: Check repository plugin wiring
        run: python -m unittest discover -s tests -p test_repository_plugins.py -v
      - name: Validate repository feature contracts
        run: python .feature-platform/tools/featurectl.py validate --project-dir .
