name: Code diagrams

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  # Analyze the checkout and upload artifacts without granting repository write access.
  contents: read

concurrency:
  # Replace obsolete analyses when another commit arrives on the same branch or PR.
  group: code-diagrams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/code-diagrams-requirements.txt
      - name: Install Serena and the Python language server
        run: python -m pip install -r scripts/code-diagrams-requirements.txt
      - name: Test graph extraction, including real LSP resolution
        # A real cross-file fixture catches incompatibilities in the pinned Serena/Jedi APIs.
        env:
          CODE_DIAGRAMS_LSP_TEST: '1'
        run: python -m unittest discover -s tests -p test_code_diagrams.py -v
      - name: Generate code diagrams
        run: python scripts/generate_code_diagrams.py
      - name: Render standalone SVG diagrams
        # Produce images that can be viewed offline without a Mermaid-capable Markdown viewer.
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          for graph in artifacts/code-diagrams/*.dot; do
            dot -Tsvg "$graph" -o "${graph%.dot}.svg"
          done
      - name: Add run summary
        # Link to the downloadable bundle; individual module graphs remain in the artifact index.
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          graph = json.loads(Path('artifacts/code-diagrams/graph.json').read_text())
          calls = sum(edge['kind'] == 'calls' for edge in graph['edges'])
          unresolved = sum(site['kind'] == 'call' for site in graph['unresolved'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('# Code diagrams\n\n')
              summary.write(f"Analyzed {len(graph['files'])} Python files with Serena LSP. "
                            f'{calls} resolved call relationships; {unresolved} external or unresolved call sites.\n\n')
              summary.write(f"Download **code-diagrams** from [this run]({os.environ['RUN_URL']}) "
                            'and open `modules.svg` or `README.md`. The artifact includes module, import, '
                            'export and call diagrams, per-module call graphs, and `graph.json`.\n')
          PY
      - name: Upload code diagrams
        # Keep generated output separate from source commits and expire old run artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: code-diagrams
          path: artifacts/code-diagrams/
          if-no-files-found: error
          retention-days: 30
